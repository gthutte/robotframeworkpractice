version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo

jobs:
  test:
    executor: python-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-deps-{{ checksum "robotframeworkpractice/requirements.txt" }}

      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            cd robotframeworkpractice
            pip install --upgrade pip
            pip install -r requirements.txt

      - save_cache:
          paths:
            - ~/.cache/pip
          key: v1-deps-{{ checksum "robotframeworkpractice/requirements.txt" }}

      - run:
          name: Run Robot Framework tests (QA)
          command: |
            . .venv/bin/activate
            cd robotframeworkpractice
            make test-qa

      - store_artifacts:
          path: robotframeworkpractice/Results
          destination: results

      - store_test_results:
          path: robotframeworkpractice/Results

workflows:
  test:
    jobs:
      - test