version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo

jobs:
  test:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r robotframeworkpractice/requirements.txt
      - run:
          name: Run Robot Framework tests (QA)
          command: |
            . .venv/bin/activate
            cd robotframeworkpractice
            make test-qa
      - store_artifacts:
          path: robotframeworkpractice/Results
          destination: results

workflows:
  version: 2
  test:
    jobs:
      - test
